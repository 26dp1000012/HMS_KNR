{% extends "base.html" %}
{% block content %} 

    <div class="input-form">
        <form>
            <h3 class="center">Register New User</h3>
            <table class="center">
            <tr><td><label>Email: </label></td><td><input type="email" name="emailid"></td></tr>
            <tr><td><label>Full name: </label></td><td><input type="text" name="fname"></td></tr>
            <tr><td><label>User type: </label></td>
                <td>
                    <select name="utype">
                        <option value="None" disabled selected>--select--</option>
                        <option value="Doctor">doctor</option>
                        <option value="Patients">patient</option>
                    </select>
                </td>
            </tr>
            <tr><td><label>Specialization</label></td><td><input type="text" name="splz"></td></tr>
            <tr><td><label>Address: </label></td><td><textarea rows="5" cols="20" name="address" id=""></textarea></td></tr>
            <tr><td><label>Password: </label></td><td><input type="password" name="pwd"></td></tr>
            <tr><td><input type="button" value="Register"></td><td><a href="login.html">Login here</a></td></tr>
            </table>
        </form>
    </div>
{% endblock %}
